<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F0F1A">
<meta name="description" content="学伴 StudyBuddy — RPG 游戏化智能学习助手 · DeepSeek V4 驱动">
<title>学伴 StudyBuddy</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F0F1A;--card-bg:#1A1A2E;--gold:#FFD700;--gold-dim:#B8960F;
  --purple:#7C3AED;--purple-light:#A78BFA;--purple-bg:rgba(124,58,237,0.15);
  --text:#E2E8F0;--text2:#94A3B8;--text3:#64748B;
  --success:#10B981;--danger:#EF4444;--warning:#F59E0B;
  --border:rgba(255,255,255,0.08);--radius:16px;--radius-sm:10px;
  --bottom-nav-h:68px;--top-safe:env(safe-area-inset-top,0px);--bottom-safe:env(safe-area-inset-bottom,0px);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--bottom-nav-h) + var(--bottom-safe) + 16px);
  padding-top:var(--top-safe);min-height:100vh;
}
.header{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg)}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.level-badge{display:flex;align-items:center;gap:4px;background:var(--purple-bg);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;color:var(--purple-light)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card-bg);border-top:1px solid var(--border);display:flex;height:var(--bottom-nav-h);padding-bottom:var(--bottom-safe);box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.bottom-nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text3);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.bottom-nav button.active{color:var(--gold);font-weight:600}
.bottom-nav button .icon{font-size:22px;line-height:1}
.page{display:none;padding:0 16px;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.card{background:var(--card-bg);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-header h3{font-size:15px;font-weight:600;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#1a1a00}
.btn-gold:active{transform:scale(.97);opacity:.9}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:active{background:#6D28D9;transform:scale(.97)}
.btn-outline{background:transparent;color:var(--purple-light);border:1.5px solid var(--purple)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:20px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.input,.select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:rgba(255,255,255,0.04);color:var(--text);outline:none;transition:border-color .15s;font-family:inherit}
.input:focus,.select:focus{border-color:var(--purple)}
.label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-group{margin-bottom:14px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.tag-gold{background:rgba(255,215,0,0.15);color:var(--gold)}
.tag-purple{background:var(--purple-bg);color:var(--purple-light)}
.tag-success{background:rgba(16,185,129,0.15);color:var(--success)}
.tag-danger{background:rgba(239,68,68,0.15);color:var(--danger)}
.tag-warning{background:rgba(245,158,11,0.15);color:var(--warning)}
.progress-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
.progress-gold{background:linear-gradient(90deg,var(--gold),var(--gold-dim))}
.progress-purple{background:linear-gradient(90deg,var(--purple),var(--purple-light))}
.task-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.02);margin-bottom:8px;transition:all .2s}
.task-item.completed{opacity:.4}
.task-item.completed .task-title{text-decoration:line-through}
.task-checkbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;font-size:12px;color:transparent}
.task-checkbox.done{background:var(--success);border-color:var(--success);color:#fff}
.task-info{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:500}
.task-meta{font-size:12px;color:var(--text2);margin-top:2px}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal{background:var(--card-bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease;border:1px solid var(--border);border-bottom:none}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--gold)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.energy-bar{display:flex;gap:6px;margin:12px 0}
.energy-slot{width:32px;height:32px;border-radius:8px;border:2px solid var(--border);transition:all .3s}
.energy-slot.filled{background:linear-gradient(135deg,var(--gold),var(--purple));border-color:transparent;box-shadow:0 0 12px rgba(124,58,237,.3)}
.energy-slot.empty{border-color:rgba(255,255,255,0.1)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--border)}
.stat-card .value{font-size:28px;font-weight:700;color:var(--gold)}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:2px}
.fab{position:fixed;bottom:calc(var(--bottom-nav-h) + var(--bottom-safe) + 20px);right:20px;z-index:90;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--purple));color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.fab:active{transform:scale(.9)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;background:#1E293B;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:500;animation:fadeIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none;border:1px solid var(--border)}
.step-indicator{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:all .3s}
.step-dot.active{background:var(--gold);box-shadow:0 0 8px var(--gold);width:24px;border-radius:4px}
.step-dot.done{background:var(--success)}
.chat-area{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.chat-msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;animation:fadeIn .3s ease}
.chat-msg.ai{align-self:flex-start;background:var(--card-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--purple),#5B21B6);border-bottom-right-radius:4px}
.achieve-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.achieve-card{text-align:center;padding:16px 8px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.02);border:1px solid var(--border);transition:all .3s}
.achieve-card.unlocked{border-color:var(--gold);background:rgba(255,215,0,0.05)}
.achieve-card.locked{opacity:.4}
.achieve-card .icon{font-size:36px;margin-bottom:4px}
.achieve-card .name{font-size:11px;font-weight:600}
.achieve-card .cond{font-size:10px;color:var(--text3);margin-top:2px}
.skill-row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.02);border:1px solid var(--border)}
.skill-icon{font-size:28px;width:44px;text-align:center}
.skill-info{flex:1}
.skill-name{font-weight:600;font-size:14px}
.skill-effect{font-size:12px;color:var(--text2)}
.skill-level{font-size:13px;color:var(--gold);font-weight:600}
.exercise-card{padding:16px;border-radius:var(--radius);background:rgba(255,255,255,0.02);border:1px solid var(--border);margin-bottom:12px}
.exercise-card .q-title{font-size:14px;font-weight:600;margin-bottom:10px}
.choice-btn{display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:6px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-size:14px;cursor:pointer;transition:all .15s}
.choice-btn:active{background:rgba(255,255,255,0.05)}
.choice-btn.correct{border-color:var(--success);background:rgba(16,185,129,0.1)}
.choice-btn.wrong{border-color:var(--danger);background:rgba(239,68,68,0.1)}
.levelup-overlay{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeIn .3s ease}
.levelup-content{text-align:center;animation:popIn .5s ease}
.levelup-content .lv{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .icon{font-size:56px;margin-bottom:12px}
.empty-state p{font-size:14px}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.5)}}
.xp-particle{position:fixed;pointer-events:none;z-index:220;font-weight:900;font-size:18px;color:var(--gold);animation:xpFloat 1s ease-out forwards}
.install-banner{display:none;background:linear-gradient(135deg,var(--purple),#5B21B6);color:#fff;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;align-items:center;gap:12px}
.install-banner.show{display:flex}
.install-banner .msg{flex:1;font-size:13px}
.install-banner .btn{background:#fff;color:var(--purple);white-space:nowrap}
@media(min-width:500px){.page{padding:0 24px;max-width:500px;margin:0 auto}.header,.bottom-nav{max-width:500px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}}
.plan-grid{display:grid;gap:12px}
.plan-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--card-bg);cursor:pointer;transition:all .15s}
.plan-card:active{transform:scale(.98)}
.plan-card .p-name{font-size:16px;font-weight:600;margin-bottom:4px}
.plan-card .p-meta{font-size:12px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap}
.concept-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.concept-tag{padding:4px 12px;border-radius:12px;font-size:12px;background:var(--purple-bg);color:var(--purple-light)}
.xp-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px}

/* Onboarding */
.onboard-container{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column}
.onboard-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;animation:fadeIn .3s ease}
.onboard-slide .ob-icon{font-size:80px;margin-bottom:24px}
.onboard-slide h2{font-size:24px;font-weight:700;color:var(--gold);margin-bottom:12px}
.onboard-slide p{font-size:15px;color:var(--text2);line-height:1.6;max-width:280px}
.onboard-dots{display:flex;gap:8px;justify-content:center;padding:20px}
.onboard-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:all .3s}
.onboard-dot.active{background:var(--gold);width:24px;border-radius:4px}
.onboard-footer{padding:0 30px 40px;display:flex;flex-direction:column;gap:12px}
.onboard-footer .hint{text-align:center;font-size:11px;color:var(--text3)}

/* Resource card */
.resource-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;gap:12px;align-items:center}
.resource-card.selected{border-color:var(--gold);background:rgba(255,215,0,0.05)}
.resource-card .r-icon{font-size:28px;flex-shrink:0}
.resource-card .r-info{flex:1;min-width:0}
.resource-card .r-name{font-size:14px;font-weight:600}
.resource-card .r-author{font-size:12px;color:var(--text2)}
.resource-card .r-type{font-size:11px;color:var(--purple-light)}
.resource-card .r-score{color:var(--gold);font-size:13px;font-weight:600}
/* Syllabus editor */
.syllabus-day{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);margin-bottom:6px;transition:all .15s}
.syllabus-day.skipped{opacity:.3;text-decoration:line-through}
.syllabus-day .s-day{width:36px;text-align:center;font-weight:700;color:var(--gold);flex-shrink:0}
.syllabus-day .s-info{flex:1;min-width:0}
.syllabus-day .s-title{font-size:13px;font-weight:500}
.syllabus-day .s-concepts{font-size:11px;color:var(--text2)}
.syllabus-day .s-actions{display:flex;gap:4px;flex-shrink:0}
/* Skeleton loading */
.skeleton{background:linear-gradient(90deg,var(--card-bg) 25%,rgba(255,255,255,0.04) 50%,var(--card-bg) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
.skeleton-text{height:14px;margin-bottom:8px;width:80%}
.skeleton-text.short{width:50%}
/* Resource search loading */
.search-loading{text-align:center;padding:30px}
.search-loading .spin{font-size:40px;animation:popIn 1s infinite}
/* Global progress bar */
.global-progress{position:fixed;top:0;left:0;right:0;z-index:400;background:var(--card-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:none;animation:slideDown .25s ease}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.global-progress .gp-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin-top:6px}
.global-progress .gp-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:2px;width:0%;transition:width .5s ease}
.global-progress .gp-text{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.global-progress .gp-cancel{color:var(--danger);cursor:pointer;font-size:12px}
/* Generating state card */
.plan-card.generating{opacity:.6;pointer-events:none;position:relative}
.plan-card.generating::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,0.02) 50%,transparent 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
</style>
</head>
<body>

<div id="xpParticles"></div>

<!-- Onboarding Overlay -->
<div class="onboard-container" id="onboarding" style="display:none">
  <div style="flex:1;display:flex;flex-direction:column">
    <div class="onboard-slide" id="obSlide">
      <div class="ob-icon" id="obIcon">🎓</div>
      <h2 id="obTitle">30天搞定任何学科</h2>
      <p id="obDesc">AI 为你定制每日学习计划</p>
    </div>
    <div class="onboard-dots" id="obDots"></div>
  </div>
  <div class="onboard-footer">
    <button class="btn btn-gold btn-block" id="obBtn" onclick="nextOnboard()">下一步 →</button>
    <button class="btn btn-outline btn-block" id="obSkip" onclick="skipOnboard()">跳过</button>
    <p class="hint">高级 AI 功能需配置 API Key，1 分钟即可搞定</p>
  </div>
</div>

<!-- Header -->
<header class="header">
  <h1>⚔️ 学伴</h1>
  <div class="level-badge">⬆ Lv.<span id="headerLevel">1</span></div>
</header>

<!-- Install Banner -->
<div class="install-banner" id="installBanner">
  <span class="msg">📲 安装到手机桌面，随时随地学习</span>
  <button class="btn btn-sm" onclick="installApp()">安装</button>
  <button class="btn btn-sm" style="background:transparent;color:#fff" onclick="this.parentElement.classList.remove('show')">✕</button>
</div>

<!-- Page: Plans List -->
<div class="page active" id="page-plans">
  <div class="energy-bar" id="energyBar"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:18px">📋 学习计划</h2>
    <span style="font-size:13px;color:var(--text2)" id="activeStatus"></span>
  </div>
  <div id="planList"></div>
</div>

<!-- Page: Adventure -->
<div class="page" id="page-adventure">
  <h2 style="font-size:18px;margin-bottom:16px">📊 学习数据</h2>
  <div class="card" style="text-align:center">
    <div style="font-size:64px" id="charEmoji">⚔️</div>
    <h3 id="charName" style="color:var(--gold)">学徒</h3>
    <div class="xp-bar-label"><span>EXP</span><span id="xpText">0 / 100</span></div>
    <div class="progress-bar"><div class="progress-fill progress-gold" id="xpBar" style="width:0%"></div></div>
    <div style="margin-top:8px;font-size:12px;color:var(--text3)">技能点：<span id="skillPoints" style="color:var(--gold)">0</span></div>
  </div>
  <div class="card"><h3 style="font-size:14px;margin-bottom:8px">🔋 本周能量</h3><div class="energy-bar" id="energyBarLarge"></div><div style="font-size:12px;color:var(--text2)">碎片：<span id="fragments" style="color:var(--gold)">0</span></div></div>
  <div class="card"><h3 style="font-size:14px;margin-bottom:12px">🧠 学习能力</h3><div id="skillTree"></div></div>
  <div class="card"><h3 style="font-size:14px;margin-bottom:12px">🏆 里程碑</h3><div class="achieve-grid" id="achievementWall"></div></div>
  <div class="card" style="border-color:var(--purple)"><p style="font-size:13px;color:var(--purple-light);font-style:italic" id="adventureLog"></p></div>
</div>

<!-- Page: Settings -->
<div class="page" id="page-settings">
  <h2 style="font-size:18px;margin-bottom:16px">⚙️ 设置</h2>
  <div class="card"><h3 style="font-size:15px;margin-bottom:12px">🔑 DeepSeek API</h3><div id="apiStatus"></div><button class="btn btn-purple btn-block" onclick="openApiWizard()" style="margin-top:8px">🔧 API 配置向导</button></div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:12px">📊 复习强度</h3><div id="reviewModeSetting"></div></div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:12px">💾 数据管理</h3><button class="btn btn-outline btn-block" onclick="exportData()" style="margin-bottom:8px">📤 导出学习数据</button><button class="btn btn-outline btn-block" onclick="importDataPrompt()">📥 恢复数据</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></div>
  <div class="card" style="border-color:var(--danger)"><h3 style="font-size:15px;color:var(--danger);margin-bottom:8px">⚠️ 危险操作</h3><button class="btn btn-block" style="background:var(--danger);color:#fff" onclick="resetAll()">🗑 清除所有数据</button></div>
  <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:20px">学伴 StudyBuddy v3.0 · PWA · DeepSeek V4</p>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="active" data-page="plans"><span class="icon">📋</span>计划</button>
  <button data-page="adventure"><span class="icon">📊</span>进度</button>

];

function load(){ try{ const r=localStorage.getItem(STORAGE_KEY); if(r){ const d=JSON.parse(r); D={...D,...d,user:{...D.user,...(d.user||{})},settings:{...D.settings,...(d.settings||{})}}; } }catch(e){} migrate(); }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(D)); }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmt(d){ const dd=new Date(d+'T00:00:00'); return (dd.getMonth()+1)+'月'+dd.getDate()+'日'; }
function addDays(d,n){ const dd=new Date(d+'T00:00:00'); dd.setDate(dd.getDate()+n); return dd.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function migrate(){
  D.user = D.user || { charClass:'apprentice',xp:0,level:1,skillPoints:0,skills:{focus:0,memory:0,insight:0},energy:7,energyFragments:0,lastEnergyReset:null,lastActiveDate:null,onboardingDone:false,feynmanCount:0,exerciseCount:0,streakDays:0 };
  D.user.skills = D.user.skills || {focus:0,memory:0,insight:0};

  D.bgTasks = D.bgTasks || [];
}

/* ═══════════ BACKGROUND TASK MANAGER ═══════════ */
const BgTaskManager = {
  queue: [],
  currentTask: null,
  isRunning: false,

  add(task){
    task.id = uid(); task.status='queued'; task.createdAt=Date.now();
    this.queue.push(task); D.bgTasks = this.queue.map(t=>({id:t.id,planId:t.planId,status:t.status,type:t.type})); save();
    if(!this.isRunning) this.processNext();
    return task.id;
  },

  async processNext(){
    if(this.isRunning || this.queue.length===0) return;
    this.isRunning = true;
    this.currentTask = this.queue.shift();
    this.currentTask.status = 'running';
    showGlobalProgress(this.currentTask);
    try{
      await this.currentTask.execute(this.currentTask);
      this.currentTask.status = 'completed';
      if(this.currentTask.onComplete) this.currentTask.onComplete();
      if('Notification' in window && Notification.permission==='granted'){
        new Notification('学伴',{body:this.currentTask.doneMsg||'任务已完成',icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%234F46E5" width="100" height="100" rx="20"/><text x="50" y="68" text-anchor="middle" fill="white" font-size="56">📚</text></svg>'});
      }
    }catch(e){
      this.currentTask.status = 'failed';
      toast('⚠️ '+((this.currentTask.failMsg||'任务失败')+'，已切换本地模式'));
      if(this.currentTask.onFail) this.currentTask.onFail();
    }
    hideGlobalProgress();
    this.isRunning = false; this.currentTask = null;
    renderAll();
    setTimeout(()=>this.processNext(),300);
  },

  cancel(taskId){
    const idx = this.queue.findIndex(t=>t.id===taskId);
    if(idx>=0){ this.queue.splice(idx,1); return true; }
    if(this.currentTask&&this.currentTask.id===taskId){
      this.currentTask.status='cancelled';
      hideGlobalProgress();
      this.isRunning=false; this.currentTask=null;
      if(this.queue.length>0) this.processNext();
      return true;
    }
    return false;
  }
};

let currentBgTaskId = null;

function showGlobalProgress(task){
  currentBgTaskId = task.id;
  const gp = document.getElementById('globalProgress');
  gp.style.display = 'block';
  document.getElementById('gpTitle').textContent = task.title||'🤖 AI 处理中...';
  document.getElementById('gpSub').textContent = task.subtitle||'';
  document.getElementById('gpFill').style.width = '20%';
  document.getElementById('gpCancel').style.display = task.canCancel!==false?'inline':'none';

  // Simulate progress steps
  const steps = task.progressSteps||['准备中...','处理中...','即将完成...'];
  let step = 0;
  const totalSteps = steps.length;
  const interval = setInterval(()=>{
    if(currentBgTaskId !== task.id){ clearInterval(interval); return; }
    step++;
    if(step < totalSteps){
      document.getElementById('gpSub').textContent = steps[step];
      document.getElementById('gpFill').style.width = (20+(step/totalSteps)*70)+'%';
    }
    if(BgTaskManager.currentTask?.status==='completed'||BgTaskManager.currentTask?.status==='failed'){
      document.getElementById('gpFill').style.width='95%';
      clearInterval(interval);
    }
  }, 2000);
  task._progressInterval = interval;
}

function hideGlobalProgress(){
  const gp = document.getElementById('globalProgress');
  document.getElementById('gpFill').style.width='100%';
  if(currentBgTaskId){
    const task = BgTaskManager.currentTask;
    if(task&&task._progressInterval) clearInterval(task._progressInterval);
  }
  setTimeout(()=>{ gp.style.display='none'; document.getElementById('gpFill').style.width='20%'; }, 500);
  currentBgTaskId = null;
}

function cancelBgTask(){
  if(currentBgTaskId){
    BgTaskManager.cancel(currentBgTaskId);
    toast('已取消');
  }
}

// ═══════════════ DEEPSEEK API ═══════════════
async function deepseekCall(messages, opts={}){
  if(!D.apiKey) return null;
  const { tools, maxTokens=1000, temperature=0.7 } = opts;
  const body = { model:MODEL, messages, max_tokens:maxTokens, temperature };
  if(tools) body.tools = tools;
  try{
    const resp = await fetch(DEEPSEEK_URL, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+D.apiKey}, body:JSON.stringify(body) });
    if(!resp.ok){
      if(resp.status===402){ toast('💰 API 余额不足，已切换本地模式'); return null; }
      return null;
    }
    const data = await resp.json();
    // Track token usage
    if(data.usage){
      D.tokenUsage.total = (D.tokenUsage.total||0) + (data.usage.total_tokens||0);
      D.tokenUsage.count = (D.tokenUsage.count||0) + 1;
      save();
    }
    return data;
  }catch(e){ return null; }
}

function getTokenStats(){
  const t = D.tokenUsage || {total:0,count:0};
  const cost = (t.total / 1000000 * 1).toFixed(4); // ~¥1 per 1M tokens
  return `已调用 ${t.count||0} 次 · ${(t.total||0).toLocaleString()} Token · 约 ¥${cost}`;
}

async function searchResources(topic){
  const cacheKey = 'search_'+topic;
  const cached = D.resourceCache[cacheKey];
  if(cached && (Date.now()-cached.time < 86400000)) return cached.data;

  if(!D.apiKey) return getLocalResources(topic);

  toast('🔍 DeepSeek V4 正在联网搜索...');
  const msgs = [
    {role:'system',content:`你是学习资源推荐专家。搜索并推荐4-6个优质学习资源。对每个资源必须提供：
1. name - 资源名称
2. author - 作者/平台
3. type - 类型（视频课程/书籍/在线教程/练习平台/文档）
4. url - 真实可访问的链接（必须来自搜索结果，不能编造）
5. description - 简短描述（1句话）
6. pros - 优点（2-3条，每条不超过15字）
7. cons - 缺点（1-2条，每条不超过15字）
8. matchScore - 匹配度评分1-100

返回严格JSON：{"resources":[...]}`},
    {role:'user',content:`搜索学习主题"${topic}"的优质资源，要求链接真实可访问，并给出每个资源的优缺点对比。`}
  ];
  const resp = await deepseekCall(msgs, {tools:[{type:'web_search'}],maxTokens:2500});
  if(resp){
    try{
      const content = resp.choices[0].message.content;
      const json = JSON.parse(content.match(/\{[\s\S]*\}/)?.[0] || content);
      if(json.resources && json.resources.length>0){
        D.resourceCache[cacheKey] = {data:json.resources,time:Date.now()};
        save();
        toast(`✅ 搜索完成！找到 ${json.resources.length} 个资源 (${getTokenStats()})`);
        return json.resources;
      }
    }catch(e){ console.log('Parse error:',e); }
  }
  toast('⚠️ 使用本地资源库');
  return getLocalResources(topic);
}

function xpForLevel(lv){ return 100 * lv; }
function calcLevel(xp){ let lv=1; while(xp >= xpForLevel(lv)){ xp -= xpForLevel(lv); lv++; } return lv; }
function xpProgress(xp){ let lv=calcLevel(xp); let total=0; for(let i=1;i<lv;i++) total+=xpForLevel(i); return {level:lv, current:xp-total, needed:xpForLevel(lv)}; }

function addXp(amount, reason){
  const bonus = 1 + D.user.skills.focus * 0.05;
  const total = Math.round(amount * bonus);
  D.user.xp += total;
  const oldLv = D.user.level;
  D.user.level = calcLevel(D.user.xp);
  save();
  const el = document.createElement('div');
  el.className = 'xp-particle';
  el.textContent = `+${total} XP`;
  el.style.left = (30+Math.random()*40)+'%'; el.style.top = '45%';
  document.getElementById('xpParticles').appendChild(el);
  setTimeout(()=>el.remove(),1000);
  if(D.user.level > oldLv) showLevelUp(D.user.level);
  checkAchievements();
}

function showLevelUp(lv){
  const ov = document.createElement('div');
  ov.className = 'levelup-overlay';

  ov.onclick = e => { if(e.target===ov) ov.remove(); };
  D.user.skillPoints++; save();
  document.body.appendChild(ov);
  setTimeout(()=>ov.remove(),5000);
}

function checkEnergyReset(){

// ═══════════════ SM-2 ALGORITHM ═══════════════
function sm2Calculate(quality, repetitions, easinessFactor, interval){
  let ef = easinessFactor || 2.5; let reps = repetitions; let newInterval = 1;
  if(quality===2){ newInterval=Math.round(interval*ef); ef+=0.1; reps++; }
  else if(quality===1){ newInterval=Math.round(interval*ef); reps++; }
  else{ newInterval=1; ef=Math.max(1.3,ef-0.2); reps=0; }
  return {interval:newInterval, ef, repetitions:reps};
}

function createReviewItems(taskId, planId, concepts){
  concepts.forEach(concept => {
    if(!concept||!concept.trim()) return;
    if(D.reviewItems.find(r=>r.planId===planId&&r.concept===concept)) return;
    D.reviewItems.push({id:uid(),planId,taskId,concept,interval:1,ef:2.5,repetitions:0,nextReviewDate:addDays(today(),1),consecutiveEasy:0,priority:0,isMastered:false,createdAt:today()});
  });
}

function getDueReviews(planId, mode){
  let items = D.reviewItems.filter(r=>r.planId===planId&&!r.isMastered&&r.nextReviewDate<=today());
  items.sort((a,b)=>(b.priority||0)-(a.priority||0));
  if(mode==='relaxed') items=items.slice(0,3);
  if(mode==='hardcore'){ const extra=D.reviewItems.filter(r=>r.planId===planId&&!r.isMastered&&r.nextReviewDate>today()); items=[...items,...extra.slice(0,5)]; }
  return items;
}

function processReview(itemId, quality){
  const item = D.reviewItems.find(r=>r.id===itemId); if(!item) return;
  const result = sm2Calculate(quality, item.repetitions, item.ef, item.interval);
  Object.assign(item, result);
  item.nextReviewDate = addDays(today(), result.interval);
  if(quality===2) item.consecutiveEasy++; else item.consecutiveEasy=0;
  if(item.consecutiveEasy>=3) item.isMastered=true;
  if(item.priority>0) item.priority=Math.max(0,item.priority-1);
  save();
}

// ═══════════════ STUDY PLAN GENERATOR ═══════════════
function generateSyllabus(topicName, totalDays, dailyMin, level){
  const syllabus = [];
  const phases = [{name:'基础入门',pct:0.4,type:'new'},{name:'核心进阶',pct:0.35,type:'new'},{name:'综合应用',pct:0.15,type:'review'},{name:'冲刺检测',pct:0.1,type:'exam'}];
  let dayNum=0; const reviewQueue=[];
  phases.forEach(phase=>{
    const phaseDays=Math.max(1,Math.round(totalDays*phase.pct));
    for(let i=0;i<phaseDays&&dayNum<totalDays;i++){
      dayNum++; const date=addDays(today(),dayNum-1);
      const t=getDayTopics(topicName, phase.name, dayNum, totalDays);
      const tasks=[];
      if(phase.type==='new'){ tasks.push({id:uid(),type:'new_content',title:`${topicName} · ${t.main}`,desc:`学习新知识点（${Math.round(dailyMin*0.55)}分钟）`,estMin:Math.round(dailyMin*0.55),concepts:t.concepts,resRef:''}); [1,3,7,14].forEach(iv=>reviewQueue.push({day:dayNum,topic:t.main,reviewDay:dayNum+iv})); }
      else if(phase.type==='review'){ tasks.push({id:uid(),type:'review',title:`${topicName} · ${t.main}`,desc:`费曼输出练习（${Math.round(dailyMin*0.5)}分钟）`,estMin:Math.round(dailyMin*0.5),concepts:t.concepts,resRef:''}); }
      else{ tasks.push({id:uid(),type:'exam',title:`${topicName} · ${t.main}`,desc:`模拟测试+查漏补缺（${Math.round(dailyMin*0.7)}分钟）`,estMin:Math.round(dailyMin*0.7),concepts:t.concepts,resRef:''}); }
      tasks.push({id:uid(),type:'active_recall',title:'🧠 闭卷回忆',desc:'不看资料，闭卷回忆前一天要点（15分钟）',estMin:15,concepts:[],resRef:''});
      if(dayNum%3===0) tasks.push({id:uid(),type:'feynman',title:'🗣 费曼输出',desc:'假装教一个完全不懂的人（20分钟）',estMin:20,concepts:t.concepts,resRef:''});
      reviewQueue.filter(r=>r.reviewDay===dayNum).forEach(r=>{ tasks.push({id:uid(),type:'spaced_review',title:`🔄 间隔复习·${r.topic}`,desc:'艾宾浩斯遗忘曲线节点复习（25分钟）',estMin:25,concepts:[],resRef:''}); });
      syllabus.push({day:dayNum, date, tasks, phase:phase.name, title:t.main, concepts:t.concepts});
    }
  });
  return syllabus;
}

function getDayTopics(name, phase, day, total){
  const topics = {'基础入门':{main:'基础概念与框架',concepts:['核心定义','基本定理','知识框架']},'核心进阶':{main:'重点难点突破',concepts:['核心定理','典型例题','常见陷阱']},'综合应用':{main:'综合运用与实践',concepts:['跨章节综合','实际应用','解题技巧']},'冲刺检测':{main:'全面检测与复盘',concepts:['模拟测试','查漏补缺','考前冲刺']}};
  const t = topics[phase]||{main:`第${day}天学习`,concepts:['知识点']};
  return {main:`${t.main}（${day}/${total}）`,concepts:t.concepts};
}

async function wizardNext(){
  const s = wizardState.step;
  const ws = wizardState;

  if(s===0 && !ws.topicName.trim()){ toast('请输入学习主题'); return; }

  // Step 5 → search resources
  if(s===5){
    if(ws.searchResults.length===0 && ws.topicName.trim()){
      ws.isSearching = true; renderWizard();
      const results = await searchResources(ws.topicName);
      ws.searchResults = results; ws.isSearching = false; renderWizard();
      return;
    }
    if(ws.searchResults.length===0){ toast('请等待搜索完成或自定义资源'); return; }
  }

  if(s===6){ createPlan(); return; }

  // Step 4→5: trigger search when moving to resource step
  if(s===4 && ws.topicName.trim() && ws.searchResults.length===0){
    ws.step = 5; ws.isSearching = true; renderWizard();
    const results = await searchResources(ws.topicName);
    ws.searchResults = results; ws.isSearching = false; renderWizard();
    return;
  }

  wizardState.step++; renderWizard();
  document.getElementById('wizardModalInner').scrollTop = 0;
}

function addCustomResource(){

  wizardState.searchResults.push({name:val,author:'自定义资源',type:'其他',description:'用户手动添加',matchScore:80});

function createPlan(){
  const ws = wizardState;
  if(!ws.topicName.trim()){ toast('请输入学习主题'); return; }
  const res = ws.searchResults[ws.selectedResource];
  document.getElementById('wizardModal').style.display = 'none';

  if(D.apiKey && res){
    // Create placeholder plan with generating status
    const placeholderPlan = {
      id: uid(), topicName: ws.topicName, totalDays: ws.totalDays, dailyMin: ws.dailyMin,
      level: ws.level, focusTags: ws.focusTags.join(','),
      selectedResource: res?JSON.stringify(res):'',
      resourceAnalysis: '', syllabus: '[]', isPersonalized: true,
      status:'generating', createdAt: today(), syllabusEdits: {}
    };
    D.plans.unshift(placeholderPlan);
    D.syllabusEdits[placeholderPlan.id] = {};
    save();
    renderAll();

    // Queue background task
    BgTaskManager.add({
      type:'generate_plan',
      planId: placeholderPlan.id,
      title:'🧠 DeepSeek V4 Pro 正在编排课程...',
      subtitle:'正在搜索「'+res.name+'」的课程结构',
      progressSteps:['搜索课程目录...','分析章节结构...','根据每日'+ws.dailyMin+'分钟拆分学习量...','正在生成个性化大纲...'],
      doneMsg:'「'+ws.topicName+'」的学习计划已生成完毕',
      failMsg:'大纲生成失败',
      canCancel: true,
      async execute(task){
        const result = await runPersonalizedGeneration(ws, res);
        if(!result){ throw new Error('Generation failed'); }
        // Update the placeholder plan
        const plan = D.plans.find(p=>p.id===task.planId);
        if(plan){
          plan.syllabus = JSON.stringify(result.syllabus);
          plan.resourceAnalysis = result.analysisText;
          plan.status = 'active';
          // Create tasks
          const reviewQueue = [];
          result.syllabus.forEach((day,i)=>{
            const date = addDays(today(),i);
            const dayNum = i+1;
            const tasks=[];
            tasks.push({id:uid(),planId:plan.id,planName:ws.topicName,date,dayNum,type:'new_content',title:`${ws.topicName} · ${day.title||'第'+dayNum+'天'}`,desc:`学习${day.resourceRef||'指定内容'}（约${day.estMinutes||ws.dailyMin}分钟）`,estMin:day.estMinutes||Math.round(ws.dailyMin*0.6),concepts:day.concepts||[],resRef:day.resourceRef||''});
            [1,3,7,14].forEach(iv=>reviewQueue.push({day:dayNum,topic:day.title,reviewDay:dayNum+iv}));
            tasks.push({id:uid(),planId:plan.id,planName:ws.topicName,date,dayNum,type:'active_recall',title:'🧠 闭卷回忆',desc:'不看资料，闭卷回忆前一天要点（15分钟）',estMin:15,concepts:[],resRef:''});
            if(dayNum%3===0) tasks.push({id:uid(),planId:plan.id,planName:ws.topicName,date,dayNum,type:'feynman',title:'🗣 费曼输出',desc:'用自己的话讲解已学概念（20分钟）',estMin:20,concepts:day.concepts||[],resRef:''});
            reviewQueue.filter(r=>r.reviewDay===dayNum).forEach(r=>{tasks.push({id:uid(),planId:plan.id,planName:ws.topicName,date,dayNum,type:'spaced_review',title:`🔄 间隔复习·${r.topic}`,desc:'艾宾浩斯遗忘曲线节点复习（25分钟）',estMin:25,concepts:[],resRef:''});});
            tasks.forEach(t=>D.tasks.push(t));
          });
          save();
        }
      },
      onComplete(){ toast('✅ 「'+ws.topicName+'」AI 个性化大纲已生成！'); renderAll(); },
      onFail(){ createPlanGeneric(ws, res); }
    });
  } else {
    createPlanGeneric(ws, res);
  }
}

async function runPersonalizedGeneration(ws, res){
  const msgs = [
    {role:'system',content:`你是课程规划专家。根据用户选择的学习资源，分析其真实章节结构，生成个性化每日学习计划。

用户参数：
- 学习主题：${ws.topicName}
- 总天数：${ws.totalDays} 天
- 每日时长：${ws.dailyMin} 分钟
- 当前水平：${ws.level==='beginner'?'零基础':ws.level==='intermediate'?'有一定基础':'进阶'}
- 目标侧重：${ws.focusTags.length>0?ws.focusTags.join('、'):'综合学习'}
- 选中资源：${res.name}（${res.author||''}，${res.type||''}）

要求：
1. 先用web_search搜索该资源的真实章节/集数/目录结构
2. 根据用户的总天数和每日时长，将资源内容合理拆分到每一天
3. 每天的内容量要与每日时长匹配（15分钟≈1小节，60分钟≈1-2章节，120分钟≈2-3章节）
4. 考虑用户的水平和目标侧重来调整进度

返回严格JSON格式（不要markdown包裹）：
{"resourceStructure":"资源结构简要描述","syllabus":[{"day":1,"title":"具体学习内容标题","resourceRef":"第X章/第X集/PXX-XX","concepts":["核心概念1","核心概念2"],"estMinutes":45,"phase":"基础入门"}]}`},
    {role:'user',content:`请分析"${res.name}"（${res.author||''}）的课程结构，为"${ws.topicName}"制定${ws.totalDays}天、每天${ws.dailyMin}分钟的个性化学习计划。用户水平：${ws.level}。`}
  ];

  let syllabus = null;
  let analysisText = '';

  const resp = await deepseekCall(msgs, {tools:[{type:'web_search'}],maxTokens:4000});
  if(resp){
    try{
      const content = resp.choices[0].message.content;
      const jsonMatch = content.match(/\{[\s\S]*\}/);
      const json = JSON.parse(jsonMatch ? jsonMatch[0] : content);
      if(json.syllabus && json.syllabus.length>0){
        return {syllabus:json.syllabus, analysisText:json.resourceStructure||''};
      }
    }catch(e){ console.log('Parse error:',e); }
  }
  return null;
}

function createPlanGeneric(ws, res){
  const syllabus = generateSyllabus(ws.topicName, ws.totalDays, ws.dailyMin, ws.level);
  const plan = {
    id: uid(), topicName: ws.topicName, totalDays: ws.totalDays, dailyMin: ws.dailyMin,
    level: ws.level, focusTags: ws.focusTags.join(','),
    selectedResource: res?JSON.stringify(res):'',
    resourceAnalysis: '',
    syllabus: JSON.stringify(syllabus),
    isPersonalized: false,
    status:'active', createdAt: today(), syllabusEdits: {}
  };
  D.plans.push(plan);
  syllabus.forEach(day => {
    day.tasks.forEach(task => {
      D.tasks.push({
        id:task.id, planId:plan.id, planName:ws.topicName,
        date:day.date, dayNum:day.day,
        title:task.title, desc:task.desc, type:task.type,
        estMin:task.estMin, concepts:task.concepts||[], resRef:task.resRef||'',
        completed:false, rating:0, xpEarned:0
      });
    });
  });
  D.syllabusEdits[plan.id] = {};
  save();
  renderAll();
  toast(`✅ 「${ws.topicName}」已创建！`);
}

function verifyAndComplete(taskId){
  const answer = document.getElementById('verifyAnswer')?.value?.trim();
  if(!answer || answer.length < 2){
    toast('请至少简单描述一下你学到的内容');
    return;
  }
  document.getElementById('taskVerifyModal').style.display = 'none';
  const task = D.tasks.find(t=>t.id===taskId);
  if(task) completeTask(task);
}

function completeTask(task){
  task.completed = !task.completed;
  if(task.completed){
    task.completedAt = new Date().toISOString(); task.xpEarned = 30;
    useEnergy(); addXp(30, '完成任务');
    if(task.concepts && task.concepts.length>0) createReviewItems(task.id, task.planId, task.concepts);
    D.user.lastActiveDate = today(); save(); checkAchievements();
  } else { task.completedAt = null; task.xpEarned = 0; save(); }
  renderAll();
}

// ═══════════════ SYLLABUS EDITOR ═══════════════
function openSyllabusEditor(planId){
  const plan = D.plans.find(p=>p.id===planId);
  if(!plan) return;
  const syllabus = JSON.parse(plan.syllabus || '[]');
  const edits = D.syllabusEdits[planId] || {};

  const html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2>📋 大纲编辑</h2><button onclick="document.getElementById('syllabusModal').style.display='none'" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer">✕</button></div>
    <p style="color:var(--text2);font-size:12px;margin-bottom:12px">点击 ✏️ 编辑 / 🔝 提前 / ⏭️ 跳过</p>
    ${syllabus.map((day,i)=>{
      const e = edits[day.day] || {};
      const skipped = e.skipped;
      const customTitle = e.title || day.title;
      return `<div class="syllabus-day ${skipped?'skipped':''}" id="syl_${planId}_${day.day}">
        <div class="s-day">D${day.day}</div>
        <div class="s-info"><div class="s-title">${customTitle}</div><div class="s-concepts">${(day.concepts||[]).join(' · ')}</div></div>
        <div class="s-actions">
          <button class="btn btn-sm btn-outline" style="font-size:11px;padding:4px 8px" onclick="editSyllabusDay('${planId}',${day.day})">✏️</button>
          <button class="btn btn-sm btn-outline" style="font-size:11px;padding:4px 8px" onclick="toggleSkipDay('${planId}',${day.day})">${skipped?'▶️':'⏭️'}</button>
          <button class="btn btn-sm btn-outline" style="font-size:11px;padding:4px 8px" onclick="moveDayUp('${planId}',${i})">🔝</button>
        </div>
      </div>`;
    }).join('')}
    <button class="btn btn-purple btn-block" style="margin-top:12px" onclick="applySyllabusEdits('${planId}')">💾 应用修改</button>`;

  document.getElementById('syllabusInner').innerHTML = html;
  document.getElementById('syllabusModal').style.display = 'flex';
}

function editSyllabusDay(planId, dayNum){
  const edits = D.syllabusEdits[planId] || {};
  const current = edits[dayNum]?.title || '';
  const newTitle = prompt('编辑标题：', current);
  if(newTitle && newTitle.trim()){
    if(!D.syllabusEdits[planId]) D.syllabusEdits[planId] = {};
    if(!D.syllabusEdits[planId][dayNum]) D.syllabusEdits[planId][dayNum] = {};
    D.syllabusEdits[planId][dayNum].title = newTitle.trim();
    save();
    const chg = confirm('仅修改标题？\n\n确定=仅修改标题\n取消=重新生成后续内容');
    if(!chg) toast('📋 后续内容将基于新标题重新生成');
  }
  openSyllabusEditor(planId);
}

function toggleSkipDay(planId, dayNum){
  if(!D.syllabusEdits[planId]) D.syllabusEdits[planId] = {};
  if(!D.syllabusEdits[planId][dayNum]) D.syllabusEdits[planId][dayNum] = {};
  D.syllabusEdits[planId][dayNum].skipped = !D.syllabusEdits[planId][dayNum].skipped;
  save();
  openSyllabusEditor(planId);
}

function moveDayUp(planId, idx){
  toast('📋 已调整顺序（演示效果）');
}

function applySyllabusEdits(planId){
  const plan = D.plans.find(p=>p.id===planId);
  if(!plan) return;
  const syllabus = JSON.parse(plan.syllabus || '[]');
  const edits = D.syllabusEdits[planId] || {};

  syllabus.forEach(day => {
    const e = edits[day.day];
    if(e?.title) day.title = e.title;
    if(e?.skipped){
      day.tasks.forEach(t => {
        const task = D.tasks.find(tk=>tk.id===t.id);
        if(task) task.type = 'skipped';
      });
    }
  });

  plan.syllabus = JSON.stringify(syllabus);
  D.syllabusEdits[planId] = {};
  save();
  document.getElementById('syllabusModal').style.display = 'none';
  renderAll();
  toast('✅ 大纲修改已应用');
}

// ═══════════════ FEYNMAN CHALLENGE ═══════════════
let feynmanState = {planId:null,concept:'',round:1,messages:[],score:0};

function openFeynman(planId, concept){
  feynmanState = {planId, concept, round:1, messages:[], score:0};
  addFeynmanMsg('ai', `我们来挑战费曼技巧！🎯\n\n请用你自己的话解释一下「**${concept}**」这个概念。尽量简单明了～`);
  document.getElementById('feynmanModal').style.display = 'flex';
  renderFeynman();
}

function addFeynmanMsg(role, text){ feynmanState.messages.push({role, text, id:uid()}); }

function renderFeynman(){
  const html = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 0 12px">
      <h2>🗣 费曼挑战</h2><span class="tag tag-gold">第 ${Math.min(feynmanState.round,3)}/3 轮</span>
      <button onclick="document.getElementById('feynmanModal').style.display='none'" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div class="chat-area" style="flex:1;overflow-y:auto;max-height:50vh" id="feynmanChat">${feynmanState.messages.map(m=>`<div class="chat-msg ${m.role}">${m.text.replace(/\n/g,'<br>')}</div>`).join('')}</div>
    ${feynmanState.round<=3?`
    <div style="display:flex;gap:8px;margin-top:12px">
      <textarea id="feynmanInput" class="input" rows="2" placeholder="写下你的解释..." style="flex:1;resize:none"></textarea>
      <button class="btn btn-gold" onclick="submitFeynman()">发送</button>
    </div>`:`
    <div style="text-align:center;padding:20px">
      <div style="font-size:48px">${feynmanState.score>=4?'🌟':feynmanState.score>=3?'⭐':'📚'}</div>
      <p style="color:var(--gold);font-weight:700;margin:8px 0">综合评分：${feynmanState.score}/5</p>
      <button class="btn btn-gold btn-block" onclick="finishFeynman()">完成挑战 (+15 XP)</button>
    </div>`}
  `;
  document.getElementById('feynmanInner').innerHTML = html;
  setTimeout(()=>{ const chat=document.getElementById('feynmanChat'); if(chat) chat.scrollTop=chat.scrollHeight; },100);
}

async function submitFeynman(){
  const input = document.getElementById('feynmanInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  addFeynmanMsg('user', text);

  // Try AI evaluation
  let aiResponse = null;
  if(D.apiKey && feynmanState.round <= 3){
    const msgs = [
      {role:'system',content:'你是费曼技巧评估师。根据用户对概念的解释给出评价和追问。追问要面向下一层级（更通俗→生活例子）。回复简洁，不超过100字。'},
      {role:'user',content:`概念：${feynmanState.concept}\n用户解释：${text}\n当前轮次：${feynmanState.round}/3\n${feynmanState.messages.slice(-3).map(m=>m.role+': '+m.text).join('\n')}`}
    ];
    const resp = await deepseekCall(msgs, {maxTokens:200});
    if(resp) aiResponse = resp.choices[0].message.content;
  }

  feynmanState.round++;
  if(feynmanState.round === 2){
    addFeynmanMsg('ai', aiResponse || `不错！但如果面向一个**完全零基础**的人，你会怎么解释「${feynmanState.concept}」？试着用更通俗的语言～`);
  } else if(feynmanState.round === 3){
    addFeynmanMsg('ai', aiResponse || `很好！能举一个**生活中的例子**来说明「${feynmanState.concept}」吗？让抽象的概念变具体 🔍`);
  } else if(feynmanState.round === 4){
    feynmanState.score = aiResponse ? 3 + Math.floor(Math.random()*3) : 3 + Math.floor(Math.random()*3);
    addFeynmanMsg('ai', aiResponse || (feynmanState.score>=4?'太棒了！你真正理解了！解释清晰，例子生动 🌟':'还不错！核心已经抓住了，继续在练习中巩固 💪'));
  }
  renderFeynman();
}

function finishFeynman(){
  D.user.feynmanCount = (D.user.feynmanCount||0) + 1;
  const xp = 15 + (D.user.charClass==='mage'?5:0);
  addXp(xp, '费曼挑战');
  document.getElementById('feynmanModal').style.display = 'none';
  save(); checkAchievements(); renderAll();
  toast(`🗣 费曼挑战完成！+${xp} XP`);
}

// ═══════════════ PRACTICE EXERCISES ═══════════════
let exerciseState = {planId:null,taskId:null,exercises:[],answers:{},submitted:false,score:0,correct:0,total:0,isLoading:false};

async function openExercises(planId, taskId){
  const task = D.tasks.find(t=>t.id===taskId);
  if(!task) return;
  exerciseState = {planId, taskId, exercises:[], answers:{}, submitted:false, score:0, correct:0, total:0, isLoading:true};
  document.getElementById('exerciseModal').style.display = 'flex';
  renderExercises();

  // Try AI generation
  let exercises = null;
  if(D.apiKey){
    const msgs = [
      {role:'system',content:'你是习题生成助手。根据学习内容生成3-5道题，至少2种题型（选择/填空）。返回严格JSON：{"exercises":[{"id":1,"type":"choice","question":"...","choices":["A...","B...","C...","D..."],"correct":"A","explanation":"..."}]}'},
      {role:'user',content:`生成关于"${task.title}"的习题。核心概念：${(task.concepts||[]).join('、')}。水平：${D.plans.find(p=>p.id===planId)?.level||'beginner'}。`}
    ];
    const resp = await deepseekCall(msgs, {maxTokens:1500});
    if(resp){
      try{
        const content = resp.choices[0].message.content;
        const json = JSON.parse(content.match(/\{[\s\S]*\}/)?.[0] || content);
        if(json.exercises) exercises = json.exercises;
      }catch(e){}
    }
  }

  if(!exercises){
    exercises = [
      {id:1,type:'choice',question:`关于"${task.title.replace(/.*·\s*/,'')}"的核心概念，以下哪项描述最准确？`,choices:['A. 它是该领域最重要的基础','B. 它只在特定场景下有用','C. 它是一个被淘汰的概念','D. 以上都不对'],correct:'A',explanation:'作为核心概念，它是后续所有学习内容的基础。'},
      {id:2,type:'choice',question:'以下哪种学习策略效率最高？',choices:['A. 被动反复阅读','B. 间隔重复+主动回忆','C. 一次性长时间学习','D. 只看不做笔记'],correct:'B',explanation:'间隔重复配合主动回忆的记忆效率是被动阅读的3倍。'},
      {id:3,type:'choice',question:'费曼技巧的核心是什么？',choices:['A. 背诵概念定义','B. 用简单语言向别人解释','C. 做大量练习题','D. 反复抄写笔记'],correct:'B',explanation:'如果你不能简单地解释它，你就没有真正理解它。'}
    ];
  }

  exerciseState.exercises = exercises;
  exerciseState.isLoading = false;
  renderExercises();
}

function renderExercises(){
  const ex = exerciseState;
  if(ex.isLoading){
    document.getElementById('exerciseInner').innerHTML = `<div class="search-loading"><h2>📝 生成习题</h2><div class="spin">🎲</div><p style="color:var(--text2)">正在为你准备今日挑战题...</p></div>`;
    return;
  }

  const html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2>📝 课后习题</h2>
      <button onclick="document.getElementById('exerciseModal').style.display='none'" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer">✕</button>
    </div>
    ${ex.submitted?`<div class="card" style="text-align:center;border-color:var(--gold)"><div style="font-size:36px">${ex.score>=80?'🎉':'📚'}</div><h3 style="color:var(--gold)">正确率：${ex.score}%</h3><p style="font-size:13px;color:var(--text2)">${ex.correct}/${ex.total} 题正确</p></div>`:''}
    ${ex.exercises.map((e,i)=>{
      let eq = `<div style="font-size:12px;color:var(--purple-light);margin-bottom:4px">${e.type==='choice'?'🔤 选择题':e.type==='fill_blank'?'✍️ 填空题':'📝 简答题'}</div>`;
      if(e.type==='choice'){
        eq += e.choices.map(c=>{
          let cls = 'choice-btn';
          if(ex.submitted && ex.answers[e.id]){
            if(c.startsWith(e.correct)) cls += ' correct';
            else if(c.startsWith(ex.answers[e.id])) cls += ' wrong';
          }
          return `<button class="${cls}" onclick="${ex.submitted?'':`exerciseState.answers[${e.id}]='${c[0]}';renderExercises()`}" style="${ex.answers[e.id]===c[0]&&!ex.submitted?'border-color:var(--gold);background:rgba(255,215,0,0.05)':''}">${c}</button>`;
        }).join('');
        if(ex.submitted) eq += `<div style="margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(16,185,129,0.1);font-size:13px;color:var(--success)">💡 ${e.explanation}</div>`;
      } else {
        eq += `<input class="input" placeholder="输入你的答案..." oninput="exerciseState.answers[${e.id}]=this.value" ${ex.submitted?'disabled':''}>`;
        if(ex.submitted) eq += `<div style="margin-top:8px;font-size:13px;color:var(--text2)">参考答案：${e.correctAnswer||e.correct}</div>`;
      }
      return `<div class="exercise-card"><div class="q-title">${i+1}. ${e.question}</div>${eq}</div>`;
    }).join('')}
    ${!ex.submitted?`<button class="btn btn-gold btn-block" onclick="submitExercises()">📝 提交答案</button>`:
    `<button class="btn btn-gold btn-block" style="margin-top:12px" onclick="finishExercises()">完成 (+20 XP)</button>`}
  `;
  document.getElementById('exerciseInner').innerHTML = html;
}

function submitExercises(){
  const ex = exerciseState;
  let correct = 0;
  ex.exercises.forEach(e => { if(ex.answers[e.id] === e.correct[0]) correct++; });
  ex.total = ex.exercises.length; ex.correct = correct;
  ex.score = Math.round((correct/ex.total)*100);
  ex.submitted = true;
  renderExercises();
}

function finishExercises(){
  D.user.exerciseCount = (D.user.exerciseCount||0) + 1;
  const xp = 20 + (exerciseState.score>=80?10:0);
  addXp(xp, '课后习题');
  D.exerciseRecords.push({
    id:uid(), planId:exerciseState.planId, taskId:exerciseState.taskId,
    date:today(), score:exerciseState.score, total:exerciseState.total, correct:exerciseState.correct,
    weakConcepts: exerciseState.score<80?['需要巩固的概念']:[]
  });
  document.getElementById('exerciseModal').style.display = 'none';
  save(); checkAchievements(); renderAll();
  toast(`📝 习题完成！正确率 ${exerciseState.score}% +${xp} XP`);
}

// ═══════════════ REVIEW ═══════════════
function openReview(planId){
  const items = getDueReviews(planId, D.settings.reviewMode);
  if(items.length===0){ toast('📭 今天没有需要复习的内容'); return; }
  let html = `<h2>🔄 间隔复习</h2><p style="color:var(--text2);font-size:13px;margin-bottom:12px">${items.length} 个概念等你复习</p>`;
  items.forEach(item=>{
    html += `<div class="card" id="reviewItem_${item.id}">
      <h4 style="margin-bottom:8px">📌 ${item.concept}</h4>
      <p style="font-size:12px;color:var(--text2)">上次：${fmt(item.createdAt)} · 间隔${item.interval}天${item.priority>0?' · 🔥优先级'+item.priority:''}</p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-sm" style="background:rgba(239,68,68,0.15);color:var(--danger)" onclick="doReview('${item.id}',0)">😣 困难</button>
        <button class="btn btn-sm btn-outline" onclick="doReview('${item.id}',1)">😐 正常</button>
        <button class="btn btn-sm btn-gold" onclick="doReview('${item.id}',2)">😊 轻松</button>
      </div></div>`;
  });
  document.getElementById('reviewInner').innerHTML = html;
  document.getElementById('reviewModal').style.display = 'flex';
}

function doReview(itemId, quality){
  processReview(itemId, quality);
  const el = document.getElementById('reviewItem_'+itemId);
  if(el) el.style.opacity='0.3';
  addXp(25,'间隔复习');
  checkAchievements();
  setTimeout(()=>{
    const items = getDueReviews(D.reviewItems.find(r=>r.id===itemId)?.planId, D.settings.reviewMode);
    if(items.length===0){ document.getElementById('reviewModal').style.display='none'; renderAll(); }
    else openReview(items[0].planId);
  },500);
}

async function saveApiKey(){
  const key = document.getElementById('apiKeyInput').value.trim();
  if(!key){ toast('请粘贴 API Key'); return; }
  if(!key.startsWith('sk-')) toast('⚠️ Key 格式可能不正确（应以 sk- 开头）');

  // Test the key
  const resp = await deepseekCall([{role:'user',content:'Hi'}], {maxTokens:10});
  if(resp){
    D.apiKey = key; save();
    document.getElementById('apiModal').style.display = 'none';
    toast('✅ 验证成功！API Key 已保存');
  } else if(key.startsWith('sk-')){
    D.apiKey = key; save();
    document.getElementById('apiModal').style.display = 'none';
    toast('⚠️ 验证失败但已保存，可稍后重试');
  } else {
    toast('❌ 验证失败，请检查 Key 是否正确');
  }
  renderAll();
}

function upgradeSkill(skill){
  if(D.user.skillPoints<=0){ toast('没有可用技能点！升级获得技能点'); return; }
  D.user.skillPoints--; D.user.skills[skill]++; save(); renderAll();
  toast(`🌟 ${skill==='focus'?'专注力':skill==='memory'?'记忆力':'洞察力'} Lv.${D.user.skills[skill]}！`);
}

function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`学伴_备份_${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('✅ 数据已导出');
}
function importDataPrompt(){ document.getElementById('importFile').click(); }
function importData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.plans&&data.user){ if(confirm('导入将覆盖当前数据，确定继续吗？')){ D=data; migrate(); save(); renderAll(); toast('✅ 数据已恢复'); } }
      else toast('⚠️ 文件格式不正确');
    }catch(err){ toast('⚠️ 文件解析失败'); }
  };
  reader.readAsText(file); event.target.value='';
}
function resetAll(){
  if(confirm('确定清除所有数据吗？此操作不可撤销！')&&confirm('再次确认：删除所有学习记录？')){

}

function renderAll(){

function updateEnergyBars(){

function renderPlans(){
  document.getElementById('activeStatus').textContent = getActiveStatus(); updateEnergyBars();
  const container = document.getElementById('planList');
  if(D.plans.length===0){
    container.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>还没有学习计划<br>点击右下角 + 开始</p></div>'; return;
  }
  container.innerHTML = `<div class="plan-grid">${D.plans.map(plan=>{
    const tasks=D.tasks.filter(t=>t.planId===plan.id); const done=tasks.filter(t=>t.completed).length;
    const total=tasks.length; const pct=total>0?Math.round(done/total*100):0;
    const todayTasks=tasks.filter(t=>t.date===today()&&!t.completed);
    const dueReviews=getDueReviews(plan.id,D.settings.reviewMode).length;
    const isGen = plan.status==='generating';
    return `<div class="plan-card ${isGen?'generating':''}" onclick="${isGen?'':`openPlanDetail('${plan.id}')`}">
      <div class="p-name">${plan.topicName} ${plan.isPersonalized?'<span class="tag tag-gold" style="font-size:10px">🧠 AI定制</span>':''} ${isGen?'<span class="tag tag-purple" style="font-size:10px">生成中...</span>':''}</div>
      <div class="p-meta"><span>${plan.totalDays}天</span><span>·</span><span>${plan.dailyMin}分钟/天</span>${plan.isPersonalized?'<span>·</span><span style="color:var(--purple-light)">Pro</span>':''}</div>
      ${isGen?`<div style="text-align:center;padding:12px 0"><div class="skeleton" style="height:6px;width:100%;margin-bottom:8px"></div><div class="skeleton skeleton-text short" style="margin:0 auto"></div><p style="font-size:11px;color:var(--text3);margin-top:4px">🧠 AI 正在编排课程...</p></div>`:
      `<div class="progress-bar"><div class="progress-fill progress-purple" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px">
        <span style="color:var(--text2)">进度 ${pct}%</span>

function openPlanDetail(planId){
  const plan=D.plans.find(p=>p.id===planId); if(!plan) return;
  const todayTasks=D.tasks.filter(t=>t.planId===planId&&t.date===today());
  const dueReviews=getDueReviews(planId,D.settings.reviewMode);
  const res = plan.selectedResource ? JSON.parse(plan.selectedResource) : null;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2>📖 ${plan.topicName}</h2>
    <button onclick="document.getElementById('planDetailModal').style.display='none'" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer">✕</button>
  </div>`;

  // Selected resource info
  if(res){
    html += `<div class="card" style="border-color:var(--purple)"><div style="display:flex;gap:10px;align-items:flex-start">
      <span style="font-size:28px">📖</span>
      <div style="flex:1">
        <h4 style="font-size:14px">📌 ${res.name||res.title}</h4>
        <p style="font-size:12px;color:var(--text2)">${res.author||''} · ${res.type||''} · 匹配度 ${res.matchScore||'?'}分</p>
        ${res.url?`<a href="${res.url}" target="_blank" style="display:inline-block;margin-top:4px;font-size:12px;color:var(--purple-light);text-decoration:underline">🔗 打开课程链接 →</a>`:''}
        ${res.pros||res.cons?`<div style="margin-top:6px;font-size:11px;display:flex;gap:12px">
          ${res.pros?`<span style="color:var(--success)">✅ ${Array.isArray(res.pros)?res.pros.join(' · '):res.pros}</span>`:''}
          ${res.cons?`<span style="color:var(--danger)">⚠️ ${Array.isArray(res.cons)?res.cons.join(' · '):res.cons}</span>`:''}
        </div>`:''}
      </div></div></div>`;
  }

  // Today's tasks
  html += `<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:15px;color:var(--gold);margin-bottom:8px">📋 今日任务</h3><button class="btn btn-sm btn-outline" style="margin-bottom:8px" onclick="openSyllabusEditor('${planId}')">📋 编辑大纲</button></div>`;
  if(todayTasks.length===0){
    html += '<p style="color:var(--text3);font-size:14px;margin-bottom:12px">今天没有任务～</p>';
  } else {
    html += todayTasks.map(t=>`
      <div class="task-item ${t.completed?'completed':''}" style="${t.type==='skipped'?'opacity:0.3':''};cursor:pointer" onclick="${t.type==='new_content'?`openCourseDetail('${planId}','${t.id}')`:`toggleTask('${t.id}')`}">
        <div class="task-checkbox ${t.completed?'done':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${t.completed?'✓':''}</div>
        <div class="task-info">
          <div class="task-title">${t.title} ${t.type==='new_content'?'<span style="font-size:10px;color:var(--purple-light)">→</span>':''}</div>
          <div class="task-meta">${t.desc} · ${t.estMin}min ${t.resRef?'· '+t.resRef:''}</div>
          <div class="concept-tags">${(t.concepts||[]).map(c=>`<span class="concept-tag">${c}</span>`).join('')}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
          <span style="font-size:11px;color:var(--text3)">${t.estMin}min</span>
          ${!t.completed&&t.type==='new_content'?`<button class="btn btn-sm btn-purple" style="font-size:11px" onclick="event.stopPropagation();openFeynman('${planId}','${(t.concepts||['概念'])[0]}')">🗣</button>`:''}
          ${!t.completed&&t.type==='new_content'?`<button class="btn btn-sm btn-outline" style="font-size:11px" onclick="event.stopPropagation();openExercises('${planId}','${t.id}')">📝</button>`:''}
        </div>
      </div>`).join('');
  }

  // Upcoming
  const upcoming = D.tasks.filter(t=>t.planId===planId&&t.date>today()&&!t.completed).slice(0,8);
  if(upcoming.length>0){
    html += `<h3 style="font-size:15px;margin:16px 0 8px;color:var(--purple-light)">📅 即将到来</h3>`;
    const byDate={}; upcoming.forEach(t=>{if(!byDate[t.date])byDate[t.date]=[];byDate[t.date].push(t);});
    Object.entries(byDate).forEach(([date,tasks])=>{
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">${fmt(date)}</span> · ${tasks.length}个任务</div>`;
    });
  }

  html += `<div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn btn-purple btn-block" onclick="event.stopPropagation();openReview('${planId}')">🔄 间隔复习 (${dueReviews})</button>
  </div>
  <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="event.stopPropagation();if(confirm('确定删除「${plan.topicName}」？')){D.plans=D.plans.filter(p=>p.id!=='${planId}');D.tasks=D.tasks.filter(t=>t.planId!=='${planId}');D.reviewItems=D.reviewItems.filter(r=>r.planId!=='${planId}');save();document.getElementById('planDetailModal').style.display='none';renderAll();toast('已删除')}">🗑 删除此计划</button>`;

  document.getElementById('planDetailInner').innerHTML = html;
  document.getElementById('planDetailModal').style.display = 'flex';
}

// ═══════════════ INIT ═══════════════
function init(){
  load();
  checkEnergyReset();
  if(!D.user.onboardingDone){
    startOnboarding();
  } else {
    renderAll();
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg => {
      // If there's a waiting worker, tell it to activate and reload
      if(reg.waiting){ reg.waiting.postMessage('skipWaiting'); window.location.reload(); }
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            newWorker.postMessage('skipWaiting');
            // Clear old caches and reload
            if(newWorker.postMessage) newWorker.postMessage('clearAll');
            setTimeout(() => window.location.reload(), 500);
          }
        });
      });
    }).catch(()=>{});
    // Listen for cache cleared message
    navigator.serviceWorker.addEventListener('message', e => {
      if(e.data && e.data.type === 'CACHE_CLEARED'){
        window.location.reload();
      }
    });
  }
  if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
}
document.addEventListener('DOMContentLoaded', init);
